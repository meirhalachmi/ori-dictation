# Make the voice samples for compare.html (scripts/make_compare.py) and commit them.
name: voice samples
on:
  push:
    paths: [scripts/make_compare.py, .github/workflows/compare.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts==7.3.1 gTTS==2.5.4
      - run: python scripts/make_compare.py
      - name: commit
        run: |
          git add compare
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make the voice samples'
          git push
